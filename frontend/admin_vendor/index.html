<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Carooa</title>
    <script>
      // Fallback for localStorage/sessionStorage in strict tracking environments (like Instagram iOS)
      try {
        var x = window.localStorage;
        x.setItem('__test', '1');
        x.removeItem('__test');
      } catch (e) {
        console.warn("Storage access restricted. Falling back to in-memory storage.");
        var inMemoryStorage = {};
        var mockStorage = {
          getItem: function(key) { return inMemoryStorage[key] || null; },
          setItem: function(key, val) { inMemoryStorage[key] = String(val); },
          removeItem: function(key) { delete inMemoryStorage[key]; },
          clear: function() { inMemoryStorage = {}; },
          length: 0,
          key: function(i) { return Object.keys(inMemoryStorage)[i] || null; }
        };
        try {
          Object.defineProperty(window, 'localStorage', { value: mockStorage });
          Object.defineProperty(window, 'sessionStorage', { value: mockStorage });
        } catch (err) {
          console.warn("Could not override storage properties", err);
        }
      }

      window.onerror = function(message, source, lineno, colno, error) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="padding: 20px; text-align: center; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">' +
            '<h2>Oops! Something went wrong.</h2>' +
            '<p>This browser might not be fully supported.</p>' +
            '<p><strong>For the best experience, tap the 3 dots (...) in the top right and select "Open in System Browser" or "Open in Safari".</strong></p>' +
            '<p style="color: #666; font-size: 12px; margin-top: 20px; max-width: 90%; word-break: break-all; border: 1px solid #ccc; padding: 10px; border-radius: 5px;">' + 
            'Error details (take a screenshot for support):<br>' +
            (message || 'Unknown error') + '<br>' + 
            (source ? 'at ' + source + ':' + lineno + ':' + colno : '') +
            '</p>' +
            '</div>';
        }
      };
      
      window.addEventListener('unhandledrejection', function(event) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="padding: 20px; text-align: center; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">' +
            '<h2>Oops! Something went wrong.</h2>' +
            '<p>This browser might not be fully supported.</p>' +
            '<p><strong>For the best experience, tap the 3 dots (...) in the top right and select "Open in System Browser" or "Open in Safari".</strong></p>' +
            '<p style="color: #666; font-size: 12px; margin-top: 20px; max-width: 90%; word-break: break-all; border: 1px solid #ccc; padding: 10px; border-radius: 5px;">' + 
            'Promise Error details (take a screenshot for support):<br>' +
            (event.reason || 'Unknown promise rejection') +
            '</p>' +
            '</div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
